<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ff6b00" />
<title>현장 캡처 → 파이</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="stylesheet" href="style.css" />
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div class="app">

  <header class="top">
    <div>
      <h1>현장 캡처 → 파이</h1>
      <div class="sub">영상·녹음을 올려두면, 파이가 나중에 학습/정리합니다</div>
    </div>
    <button class="icon-btn" id="btn-settings" aria-label="설정">⚙️</button>
  </header>

  <div class="card">
    <div class="status-row">
      <span class="dot" id="conn-dot"></span>
      <span id="conn-text">구글드라이브 연결 필요</span>
    </div>
    <div id="connect-area" style="margin-top:12px;">
      <button class="primary" id="btn-connect">구글드라이브 연결</button>
    </div>
  </div>

  <div class="big-actions" id="main-actions">
    <button class="big-btn video" id="btn-start-video">
      <span class="emoji">🎥</span>
      현장 영상 촬영
    </button>
    <button class="big-btn audio" id="btn-start-audio">
      <span class="emoji">🎙️</span>
      회의 녹음
    </button>
  </div>

  <!-- Recorder view -->
  <div class="card hidden" id="recorder-view">
    <div class="recorder">
      <video id="preview" playsinline autoplay muted></video>
    </div>
    <div class="timer"><span class="rec-dot" id="rec-dot"></span><span id="timer-text">00:00</span></div>
    <div class="btn-row single">
      <button class="danger hidden" id="btn-stop">■ 정지</button>
      <button class="primary hidden" id="btn-record">● 녹화/녹음 시작</button>
    </div>
    <button class="secondary" id="btn-cancel-record" style="margin-top:10px;">취소</button>
  </div>

  <!-- After stop: label + upload -->
  <div class="card hidden" id="review-view">
    <h2 class="section">확인 후 업로드</h2>
    <div id="review-preview"></div>
    <div class="field">
      <label for="input-label">현장명 / 메모 (선택)</label>
      <input type="text" id="input-label" placeholder="예: A현장 3층 골조, 정기회의" />
    </div>
    <div class="btn-row">
      <button class="secondary" id="btn-retake">다시 찍기</button>
      <button class="primary" id="btn-upload">드라이브로 업로드</button>
    </div>
  </div>

  <div class="card">
    <h2 class="section">업로드 내역</h2>
    <div id="queue-list"><div class="empty">아직 업로드한 항목이 없습니다</div></div>
  </div>

  <div class="card">
    <h2 class="section">파이에게 넘길 때</h2>
    <div style="font-size:13px; color:var(--muted);">업로드 후, Claude 채팅에서 아래 문구를 붙여넣으면 파이가 드라이브에서 파일을 찾아 학습/정리합니다.</div>
    <div class="prompt-box" id="prompt-example">파일 업로드 후 예시 문구가 여기에 표시됩니다.</div>
    <button class="secondary" id="btn-copy-prompt" style="margin-top:10px;">문구 복사</button>
  </div>

</div>

<!-- Settings modal -->
<div class="modal-backdrop hidden" id="settings-modal">
  <div class="modal">
    <h3>설정</h3>
    <div class="field">
      <label for="input-client-id">Google OAuth 클라이언트 ID</label>
      <input type="text" id="input-client-id" placeholder="xxxxx.apps.googleusercontent.com" />
    </div>
    <div class="field">
      <label for="input-folder-name">드라이브 폴더 이름</label>
      <input type="text" id="input-folder-name" placeholder="현장수신함" />
    </div>
    <div style="font-size:12px; color:var(--muted); margin-bottom:14px;">
      클라이언트 ID 발급 방법은 이 앱 폴더의 README.md를 참고하세요. 최초 1회만 입력하면 이 기기에 저장됩니다.
    </div>
    <div class="btn-row">
      <button class="secondary" id="btn-settings-close">닫기</button>
      <button class="primary" id="btn-settings-save">저장</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
